[package]
name = "dev-nav"
version = "0.9.0"
edition = "2024"
rust-version = "1.97"
description = "A fast, keyboard-first Windows workspace navigator for PowerShell 7"
license = "MIT"
repository = "https://github.com/JacobOptimiza/dev-nav"
keywords = ["powershell", "tui", "windows", "navigation", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = "deny"
correctness = "deny"
perf = "deny"
suspicious = "deny"

[package]
name = "dev-nav"
version = "0.1.0"
edition = "2024"
description = "A fast, keyboard-first Windows workspace navigator for PowerShell 7"
license = "MIT"
repository = "https://github.com/JacobOptimiza/dev-nav"

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DevNav terminal interface</title>
  <desc id="desc">A preview of DevNav navigating favorite repositories and launching coding agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a10"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1050" cy="90" r="180" fill="#1f8ac0" opacity=".08"/>
  <circle cx="120" cy="590" r="210" fill="#ffd166" opacity=".05"/>
  <text x="70" y="82" fill="#e8eefc" font-family="Segoe UI, sans-serif" font-size="42" font-weight="700">DevNav</text>
  <text x="70" y="120" fill="#74819a" font-family="Segoe UI, sans-serif" font-size="19">Native workspace navigation for PowerShell 7 · Built in Rust</text>
  <rect x="66" y="158" width="1068" height="408" rx="14" fill="#030507" stroke="#25344e" stroke-width="2"/>
  <circle cx="96" cy="187" r="7" fill="#ff6b6b"/><circle cx="120" cy="187" r="7" fill="#ffd166"/><circle cx="144" cy="187" r="7" fill="#55d68b"/>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="18">
    <text x="88" y="235" fill="#74c7ec">╭─ DEV</text><text x="190" y="235" fill="#74819a">$HOME</text><text x="1088" y="235" fill="#74c7ec">─╮</text>
    <text x="88" y="273" fill="#74819a">│</text><text x="112" y="273" fill="#ffd166">★ FAVORITES VISIBLE</text><text x="350" y="273" fill="#74819a">· ALIAS / DIRECTORY</text><text x="1094" y="273" fill="#74819a">│</text>
    <rect x="100" y="295" width="986" height="36" rx="5" fill="#202b41"/>
    <text x="116" y="320" fill="#e8eefc">›  ★  core - devnav-core</text>
    <text x="116" y="362" fill="#e8eefc">   ★  client-workspace</text>
    <text x="116" y="402" fill="#e8eefc">      experiments</text>
    <text x="116" y="442" fill="#e8eefc">      tools</text>
    <text x="88" y="486" fill="#74819a">├─────────────────────────────────────────────────────────────────────────────────────────────────┤</text>
    <text x="112" y="522" fill="#e8eefc">4 directories</text>
    <text x="88" y="552" fill="#74819a">╰─</text><text x="120" y="552" fill="#74c7ec">↑↓ Navigate  Enter Select  Ctrl+S Save home  F1 Shortcuts</text><text x="1090" y="552" fill="#74819a">─╯</text>
  </g>
  <g filter="url(#glow)"><rect x="884" y="54" width="250" height="44" rx="22" fill="#10283a" stroke="#74c7ec"/><text x="1009" y="82" text-anchor="middle" fill="#74c7ec" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">FAST · LOCAL · NATIVE</text></g>
</svg>

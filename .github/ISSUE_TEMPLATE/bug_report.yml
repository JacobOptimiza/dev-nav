name: Bug report
description: Report a reproducible problem in DevNav
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: DevNav version}
    validations: {required: true}
  - type: input
    id: windows
    attributes: {label: Windows version}
    validations: {required: true}
  - type: input
    id: powershell
    attributes: {label: PowerShell version}
    validations: {required: true}
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [x64, ARM64]
    validations: {required: true}
  - type: input
    id: terminal
    attributes: {label: Terminal and version}
  - type: input
    id: install
    attributes: {label: Installation method}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected result}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual result, description: Include logs or screenshots}
    validations: {required: true}
